# Danubra — konfigurácia pre Netlify

[[redirects]]
  from = "/dopyt"
  to = "/dopyt.html"
  status = 200

[[redirects]]
  from = "/pre-agentury"
  to = "/pre-agentury.html"
  status = 200

[[redirects]]
  from = "/kontakt"
  to = "/kontakt.html"
  status = 200

[[redirects]]
  from = "/obchodne-podmienky"
  to = "/obchodne-podmienky.html"
  status = 200

[[redirects]]
  from = "/ochrana-osobnych-udajov"
  to = "/ochrana-osobnych-udajov.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fotky a štýly sa nemenia — nech ich prehliadač drží v pamäti
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styl.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ==========================================================
# DOČASNÉ — bráni vyhľadávačom indexovať rozostavaný web.
# PRED SPUSTENÍM CELÝ TENTO BLOK ZMAŽ.
# ==========================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/cs/dopyt"
  to = "/cs/dopyt.html"
  status = 200

[[redirects]]
  from = "/cs/pre-agentury"
  to = "/cs/pre-agentury.html"
  status = 200

[[redirects]]
  from = "/cs/kontakt"
  to = "/cs/kontakt.html"
  status = 200
